name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]


env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install skopeo
      run: |
        sudo apt-get update
        sudo apt-get install -y skopeo

    - name: Sync images to Aliyun
      run: |
        set -e
        # 登录阿里云仓库
        skopeo login -u "$ALIYUN_REGISTRY_USER" -p "$ALIYUN_REGISTRY_PASSWORD" "$ALIYUN_REGISTRY"

        # ========== 数据预处理：判断镜像是否重名 ==========
        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^[[:space:]]*#'; then
                continue
            fi
            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            name_space="${name_space}_"
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            if [[ -n "${temp_map[$image_name]}" ]]; then
                if [[ "${temp_map[$image_name]}" != $name_space ]]; then
                    echo "duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                fi
            else
                temp_map[$image_name]=$name_space
            fi
        done < images.txt

        # ========== 逐个镜像搬运 ==========
        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^[[:space:]]*#'; then
                continue
            fi

            # 解析 --platform 参数（支持 --platform=xxx 和 --platform xxx）
            platform=$(echo "$line" | sed -n 's/.*--platform[ =]\([^ ]*\).*/\1/p')
            echo "platform is [$platform]"

            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi
            echo "platform_prefix is [$platform_prefix]"

            image=$(echo "$line" | awk '{print $NF}')
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]}" ]]; then
                if [[ -n "${name_space}" ]]; then
                    name_space_prefix="${name_space}_"
                fi
            fi

            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            echo "==================================================================="
            echo "SOURCE : docker://$image"
            echo "TARGET : docker://$new_image"
            echo "==================================================================="

            if [ -z "$platform" ]; then
                # 未指定架构 => 整镜像多架构原样拷贝（保留 manifest list）
                echo ">>> Multi-arch copy (--all)"
                skopeo copy --all --retry-times 3 \
                    docker://$image \
                    docker://$new_image
            else
                # 指定架构 => 只拷贝该架构，架构信息被完整保留
                os=$(echo "$platform" | cut -d'/' -f1)
                arch=$(echo "$platform" | cut -d'/' -f2)
                variant=$(echo "$platform" | cut -d'/' -f3)
                echo ">>> Single-arch copy os=$os arch=$arch variant=[$variant]"
                if [ -n "$variant" ]; then
                    skopeo copy --retry-times 3 \
                        --override-os "$os" --override-arch "$arch" --override-variant "$variant" \
                        docker://$image \
                        docker://$new_image
                else
                    skopeo copy --retry-times 3 \
                        --override-os "$os" --override-arch "$arch" \
                        docker://$image \
                        docker://$new_image
                fi
            fi

            # ========== 校验目标架构 ==========
            echo ">>> verify destination:"
            raw=$(skopeo inspect --raw "docker://$new_image" 2>/dev/null || echo "")
            if echo "$raw" | grep -q '"manifests"'; then
                archs=$(echo "$raw" | grep -o '"architecture":"[^"]*"' | sed 's/"architecture":"//;s/"//g' | paste -sd, -)
                echo "  RESULT: multi-arch manifest list, architectures = [$archs]"
            elif [ -n "$raw" ]; then
                arch=$(echo "$raw" | grep -o '"architecture":"[^"]*"' | head -1 | sed 's/"architecture":"//;s/"//g')
                echo "  RESULT: single-arch, architecture = [$arch]"
            else
                echo "  RESULT: verify skipped (inspect failed)"
            fi
            echo "==================================================================="
            echo ""
        done < images.txt

        echo "ALL DONE"